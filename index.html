<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>

    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>

  <body>
    <div class="container">
      <div class="content">
        <h1>Learn to code by watching others.</h1>
        <p>
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean
          commodo ligula eget dolor. Aenean massa.
        </p>
      </div>

      <div class="form-box">
        <div class="form-header">
          <p><strong>Try it free 7 days</strong> then $20/mo. thereafter</p>
        </div>
        <!-- novalidate: atributo que impede o envio do formulário se houver campos inválidos, permitindo que a validação seja feita via js. -->
        <form id="form" novalidate>
          <div class="input-field">
            <input
              type="text"
              id="name"
              name="firstName"
              class="form-control"
              placeholder="First Name"
              required
            />
            <span class="error-message"></span>
          </div>

          <div class="input-field">
            <input
              type="text"
              id="lastName"
              name="lastName"
              class="form-control"
              placeholder="Last Name"
              required
            />
        <span class="error-message"></span>
          </div>

          <div class="input-field">
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="Email Address"
              required
            />
            <span class="error-message"></span>
          </div>

      <div class="input-field">
      <div class="input-wrapper">
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="Password"
          required
        />
        <i class="fa-regular fa-eye-slash password-icon"></i>
      </div>

        <span class="error-message"></span>
      </div>

          <button type="submit">CLAIM YOUR FREE TRIAL</button> <div class="submitbutton" id="submitbutton"></div>
             <div class="terms">
          <p>
            By clicking the button, you are agreeing to our
            <a href="#">Terms and Services</a>
          </p>
      </div>
        </form>
    </div>
    <script src="/src/js/scrip.js" defer></script>
  </body>
</html>
